<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZCodium</title>
    <link rel="stylesheet" href="@zcode/ui/startup-presentation.css" />
    <script>
      // 在首帧读取与 React 相同的主题，避免浅色用户先看到深色遮罩再跳变。
      (() => {
        let saved = "zai-dark";
        try {
          saved = localStorage.getItem("zcode-theme") || saved;
        } catch {}
        const dark =
          saved === "system"
            ? window.matchMedia("(prefers-color-scheme: dark)").matches
            : saved === "dark" || saved === "zai-dark";
        document.documentElement.dataset.zcodiumStartupTheme = dark ? "dark" : "light";
        document.documentElement.classList.toggle("dark", dark);
        document.documentElement.classList.toggle("theme-zai-dark", dark);
        document.documentElement.classList.toggle("theme-zai-light", !dark);
      })();
    </script>
    <style>
      html,
      body,
      #root {
        margin: 0;
        width: 100%;
        height: 100%;
      }

      html {
        background: #161616;
      }
      html[data-zcodium-startup-theme="light"] {
        background: #f8f8f8;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <!-- 留在 React root 外：数据库准备、工作区恢复不会重建动画节点。
         静态 src 让浏览器在 bundle 执行前开始加载同款品牌图标。 -->
    <div id="zcodium-startup-overlay" aria-hidden="true">
      <div class="zcodium-startup-mark">
        <img src="/logo/icons/512x512.png" width="96" height="96" alt="" />
      </div>
    </div>
    <script>
      // 更新状态窗口复用本 HTML，但它本身是轻量弹窗，不应出现启动标记。
      if (new URLSearchParams(window.location.search).get("windowKind") === "update-status") {
        document.getElementById("zcodium-startup-overlay")?.remove();
      }
    </script>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
