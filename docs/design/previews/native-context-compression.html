            })
            .forEach(function (f) {
              setPath(state.parameterDraft.parameters, f.path, copy(f.value));
            });
          markParameterEdit(action === "reset-parameters");
        } else if (action === "use-default-parameters") {
          state.parameterDraft = {
            schemaVersion: 1,
            mode: state.defaultAuto ? "auto" : "manual",
            parameters: copy(state.defaultParameters),
          };
          markParameterEdit(true);
        } else if (action === "load-parameter-json") {
          if (jsonErrors().length) return;
          const parsed = JSON.parse(part("parameter-json").value);
          const normalized = {};
          fields.forEach(function (f) {
            setPath(normalized, f.path, copy(getPath(parsed.parameters, f.path)));
          });
          state.parameterDraft = {
            schemaVersion: 1,
            mode: parsed.mode,
            parameters: normalized,
          };
          state.parameterGroup = "trigger";
          markParameterEdit(true);
        } else if (action === "export-parameter-json") {
          if (state.parameterJsonDirty) return;
          state.parameterJsonDirty = false;
          state.parameterJsonText = "";
          state.parameterGroup = "complete";
          state.parameterNote = "配置文本已生成，可复制保存。";
          render();
          part("parameter-json").focus();
          part("parameter-json").select();
        } else if (action === "discard-parameter-json") {
          state.parameterJsonDirty = false;
          state.parameterJsonText = "";
          state.parameterNote = "已恢复为表单配置；表单修改仍未保存。";
        } else if (action === "save-parameters") {
          if (state.parameterJsonDirty || validate(state.parameterDraft).length) return;
          const parameters = copy(state.parameterDraft.parameters);
          if (state.parameterScope === "task") {
            state.taskParameters = parameters;
            state.auto = state.parameterDraft.mode === "auto";
            if (state.phase === "compressing") {
              if (state.timer) clearTimeout(state.timer);
              state.timer = null;
              state.maintenanceEvents
                .filter(function (operation) {
                  return operation.status === "待提交";
                })
                .forEach(function (operation) {
                  operation.status = "取消";
                  operation.label = "策略变化，候选作废";
                });
              state.phase = "idle";
            }
            state.parameterNote = "已保存到当前任务 · 下一请求检查点使用。";
          } else {
            state.defaultParameters = parameters;
            state.defaultAuto = state.parameterDraft.mode === "auto";
            state.parameterNote = "已保存新任务默认 · 当前任务参数保持。";
            part("default-status").textContent = "默认参数已保存，只影响之后创建的任务。";
          }
          state.parameterDirty = false;
          delete state.parameterDrafts[state.parameterScope];
        } else if (action === "cancel-parameters") {
          state.parameterDraft = baseline();
          state.parameterDirty = false;
          state.parameterJsonDirty = false;
          state.parameterJsonText = "";
          delete state.parameterDrafts[state.parameterScope];
          state.parameterNote = "已恢复上次保存的参数。";
          state.dialog = "";
          render();
          const target =
            state.parameterScope === "default"
              ? product.querySelector('[data-action="default-parameters"]')
              : product.querySelector('[data-action="context"]');
          target.focus();
        } else if (action === "compress") compress();
        else if (action === "quote") {
          if (!state.raw || part("raw").hidden) return;
          const selection = globalThis.getSelection && globalThis.getSelection();
          const selected =
            selection &&
            part("raw-text").contains(selection.anchorNode) &&
            part("raw-text").contains(selection.focusNode)
              ? selection.toString().trim()
              : "";
          const quote = selected || part("raw-text").textContent.trim();
          const draft = part("draft");
          draft.value += (draft.value ? "\n\n" : "") + "> " + quote + "\n";
          state.dialog = "";
          state.popover = false;
          state.page = "conversation";
          state.quoted = true;
          part("feedback").textContent = "片段已加入草稿，发送后才会带给模型。";
          part("feedback").hidden = false;
          render();
          draft.focus();
        } else if (action === "send") {
          part("feedback").textContent = "预览中的草稿已保留。";
          part("feedback").hidden = false;
          state.quoted = true;
        }
        render();
        persist();
      });
      product.addEventListener("keydown", function (event) {
        if (event.key === "Escape" && (state.dialog || state.popover)) {
          event.preventDefault();
          state.dialog = "";
          state.popover = false;
          render();
          const returnTo =
            state.focusReturn &&
            !state.focusReturn.closest('[data-part="overlay"]') &&
            state.focusReturn.getClientRects().length
              ? state.focusReturn
              : state.page === "settings"
                ? product.querySelector('[data-action="default-parameters"]')
                : product.querySelector('[data-action="context"]');
          returnTo.focus();
          persist();
        }
        if (event.key === "Tab" && state.dialog) {
          const candidates = Array.from(
            part("overlay").querySelectorAll(
              // 参数页含 select、textarea 和 details；漏掉它们会让弹窗焦点循环跳过可编辑项。
              "button:not(:disabled), input:not(:disabled), select:not(:disabled), textarea:not(:disabled), summary",
            ),
          ).filter(function (el) {
            return el.getClientRects().length > 0;
          });
          if (!candidates.length) return;
          if (event.shiftKey && document.activeElement === candidates[0]) {
            event.preventDefault();
            candidates[candidates.length - 1].focus();
          } else if (
            !event.shiftKey &&
            document.activeElement === candidates[candidates.length - 1]
          ) {
            event.preventDefault();
            candidates[0].focus();
          }
        }
        if (
          (event.key === "ArrowLeft" || event.key === "ArrowRight") &&
          event.target.matches('[role="tab"]')
        ) {
          event.preventDefault();
          const tabs = ["overview", "trends", "records", "parameters"];
          const next =
            (tabs.indexOf(state.dialog) + (event.key === "ArrowLeft" ? -1 : 1) + tabs.length) %
            tabs.length;
          openDialog(tabs[next], event.target);
          persist();
        }
      });
      product
        .querySelectorAll('button, select, input[type="checkbox"], summary')
        .forEach(function (control) {
          control.classList.add("cursor-interaction");
        });
      render();
      designs.push({ state: state, render: render, product: product });
      if (globalThis.ResizeObserver) {
        let scheduled = false;
        const observer = new ResizeObserver(function () {
          if (scheduled) return;
          scheduled = true;
          requestAnimationFrame(function () {
            scheduled = false;
            const current = makeTrendSamples(state).filter(function (sample) {
              return sample.segment === "current";
            });
            drawSparkline(part("popover-sparkline"), current);
            drawSparkline(part("overview-sparkline"), current);
            if (state.dialog === "trends") {
              const samples = visibleTrendSamples(),
                events = makeTrendEvents(state, samples);
              drawTrendChart(part("input-chart"), samples, "input", events);
              drawTrendChart(part("cache-chart"), samples, "cache", events);
              drawTrendChart(part("image-chart"), samples, "image", events);
            }
          });
        });
        [
          "input-chart",
          "cache-chart",
          "image-chart",
          "popover-sparkline",
          "overview-sparkline",
        ].forEach(function (name) {
          observer.observe(part(name));
        });
      }
      if (globalThis.Tweak) {
        let previousScenario = state.trendScenario;
        const tweak = new Tweak({
          container: product,
          onChange: function () {
            const changedScenario =
              previousScenario !== state.trendScenario || state.phase === "empty";
            if (state.timer && (changedScenario || state.phase !== "compressing")) {
              clearTimeout(state.timer);
              state.timer = null;
            }
            if (changedScenario) {
              state.maintenanceEvents = [];
              state.maintenanceSequence = 0;
              state.blocks = 3;
              state.used = 32000;
              state.recordFromTrends = false;
              if (state.phase === "compressing") state.phase = "idle";
            } else if (state.phase !== "compressing")
              state.maintenanceEvents
                .filter(function (operation) {
                  return operation.status === "待提交";
                })
                .forEach(function (operation) {
                  Object.assign(
                    operation,
                    state.phase === "failed"
                      ? {
                          input: 2100,
                          output: null,
                          elapsed: 1100,
                          status: "失败",
                          label: "维护未生效",
                        }
                      : { status: "取消", label: "维护已取消" },
                  );
                });
            previousScenario = state.trendScenario;
            render();
            persist();
          },
        });
        tweak.addSelect(state, "phase", {
          label: "任务状态",
          options: [
            { label: "正常", value: "idle" },
            { label: "正在压缩", value: "compressing" },
            { label: "压缩失败", value: "failed" },
            { label: "连接离线", value: "offline" },
            { label: "新任务", value: "empty" },
          ],
        });
        tweak.addToggle(state, "narrow", { label: "窄屏布局" });
        tweak.addSelect(state, "trendScenario", {
          label: "趋势数据示例",
          options: [
            { label: "正常压缩与图片", value: "normal" },
            { label: "部分用量未知", value: "unknown" },
            { label: "尚未压缩", value: "uncompressed" },
            { label: "旧任务无趋势记录", value: "legacy" },
            { label: "实际模型改变", value: "changed" },
            { label: "深度整理分段", value: "compact" },
            { label: "从父任务分叉", value: "fork" },
          ],
        });
      }
    });
    globalThis.addEventListener("openai:set_globals", function (event) {
      const incoming = event.detail && event.detail.globals && event.detail.globals.widgetState;
      const scenarios =
        incoming &&
        incoming.modelContent &&
        [2, 3].includes(incoming.modelContent.version) &&
        incoming.modelContent.scenarios;
      const uiScenarios =
        incoming &&
        incoming.privateContent &&
        [2, 3].includes(incoming.privateContent.version) &&
        incoming.privateContent.scenarios;
      if (!Array.isArray(scenarios) && !Array.isArray(uiScenarios)) return;
      designs.forEach(function (design) {
        const values = Array.isArray(scenarios)
          ? scenarios.find(function (s) {
              return s.design === design.state.design;
            })
          : null;
        const uiValues = Array.isArray(uiScenarios)
          ? uiScenarios.find(function (s) {
              return s.design === design.state.design;
            })
          : null;
        if (values) {
          if (validTrendScenarios.includes(values.trendScenario))
            design.state.trendScenario = values.trendScenario;
          if (validPhases.includes(values.phase)) {
            if (values.phase === "compressing" && values.phase !== design.state.phase)
              design.state.operationOrigin = "auto";
            if (design.state.timer && values.phase !== design.state.phase) {
              clearTimeout(design.state.timer);
              design.state.timer = null;
            }
            design.state.phase = values.phase;
          }
          ["auto", "defaultAuto", "narrow", "quoted"].forEach(function (key) {
            if (typeof values[key] === "boolean") design.state[key] = values[key];
          });
          ["taskParameters", "defaultParameters"].forEach(function (key) {
            if (
              values[key] &&
              !validate({
                schemaVersion: 1,
                mode: "auto",
                parameters: values[key],
              }).length
            )
              design.state[key] = copy(values[key]);
          });
        }
        if (uiValues) {
          if (["conversation", "settings"].includes(uiValues.page))
            design.state.page = uiValues.page;
          if (["", "overview", "trends", "records", "parameters"].includes(uiValues.dialog))
            design.state.dialog = uiValues.dialog;
          ["popover", "raw"].forEach(function (key) {
            if (typeof uiValues[key] === "boolean") design.state[key] = uiValues[key];
          });
          if (
            ["task", "default"].includes(uiValues.parameterScope) &&
            !design.state.parameterDirty &&
            !design.state.parameterJsonDirty
          )
            design.state.parameterScope = uiValues.parameterScope;
          if ([...Object.keys(groupNames), "complete"].includes(uiValues.parameterGroup))
            design.state.parameterGroup = uiValues.parameterGroup;
          if (["recent", "recent200", "zoom", "segment"].includes(uiValues.trendRange))
            design.state.trendRange = uiValues.trendRange;
          if (["current", "previous"].includes(uiValues.trendSegment))
            design.state.trendSegment = uiValues.trendSegment;
          if (
            Number.isInteger(uiValues.trendRequest) &&
            uiValues.trendRequest >= 1 &&
            uiValues.trendRequest <= 24
          )
            design.state.trendRequest = uiValues.trendRequest;
          if (uiValues.trendSeries)
            Object.keys(design.state.trendSeries).forEach(function (key) {
              if (typeof uiValues.trendSeries[key] === "boolean")
                design.state.trendSeries[key] = uiValues.trendSeries[key];
            });
        }
        if (!design.state.parameterDirty && !design.state.parameterJsonDirty)
          design.state.parameterDraft = {
            schemaVersion: 1,
            mode: (
              design.state.parameterScope === "task" ? design.state.auto : design.state.defaultAuto
            )
              ? "auto"
              : "manual",
            parameters: copy(
              design.state.parameterScope === "task"
                ? design.state.taskParameters
                : design.state.defaultParameters,
            ),
          };
        design.render();
      });
    });
    if (globalThis.lucide) globalThis.lucide.createIcons({ attrs: { width: 16, height: 16 } });
  })();
</script>
