      - file: packages/ui/src/root/useRootWorkspaceActions.ts
        symbol: startNewTaskFromActiveWorkspace
      - file: packages/shared/src/node/genUiPaths.ts
        symbol: getGenUiOutputDirectory
    invariants:
      - Ordinary task creation shares the existing pending draft owner; first accepted input consumes its directory reference.
      - Shared process cwd never determines session cwd or artifact ownership; saved task paths are restored unchanged.
      - Only the exact legacy default root enables the CLI date/session directory allocator.
