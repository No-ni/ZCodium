name: macOS Desktop Build

# 在 GitHub 托管的 macOS runner 上手动构建 arm64 的 .dmg 并上传为 artifact。
# desktop.yml 另负责 Windows/macOS 发布；这里作为本机安装入口，不创建 Release。
# 仅准备目标 macOS 的本机运行资源，不生成或下载 Linux 远端运行时。
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-desktop-${{ github.ref }}
  cancel-in-progress: false

env:
  HUSKY: "0"
  ZCODE_ENV: production
  CSC_IDENTITY_AUTO_DISCOVERY: "false"
  ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/
  ELECTRON_BUILDER_BINARIES_MIRROR: https://github.com/electron-userland/electron-builder-binaries/releases/download/

jobs:
  build:
    name: Build (mac arm64)
    runs-on: macos-15
    timeout-minutes: 120
    env:
      ZCODE_TARGET_OS: mac
      ZCODE_TARGET_ARCH: arm64
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - name: Prepare desktop runtime
        run: pnpm prepare:desktop-runtime
      - name: Build workspace and desktop
        run: pnpm build:bootstrap
      - name: Package desktop (macOS arm64)
        run: pnpm bundle:desktop -- --os mac --arch arm64 --skip-prepare --skip-build
      - name: List built artifacts
        run: ls -lh packages/desktop/dist/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: zcodium-macos-arm64
          path: |
            packages/desktop/dist/*.dmg
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
