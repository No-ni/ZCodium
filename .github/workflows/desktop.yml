name: Desktop CI

# 仅手动运行触发：GitHub 会因 fork 的 Actions 用量自动停用整个仓库的
# Workflows（2026-10-09 曾触发），push 分支、push 标签与 PR 均不自动构建。
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

env:
  HUSKY: "0"
  ZCODE_ENV: production
  CSC_IDENTITY_AUTO_DISCOVERY: "false"
  ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/
  ELECTRON_BUILDER_BINARIES_MIRROR: https://github.com/electron-userland/electron-builder-binaries/releases/download/

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Validate release version
        run: node scripts/ci/desktop-release.mjs check-version
      - uses: ./.github/actions/setup-workspace
        id: setup
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm lint
      - name: Format
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm fmt:check
      - name: Architecture
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm architecture:check
      - name: Build Agent test dependencies
        id: agent-build
        # 根安装采用 hoisted 布局；从子 workspace 启动会丢失根目录的工具路径。
        run: pnpm -r --filter './apps/zcode-cli/packages/*' build
      - name: Agent package tests
        if: ${{ !cancelled() && steps.agent-build.outcome == 'success' }}
        # 这些包的测试是 node:test、入口在各自的包级 test 脚本里；根 CI 此前只跑了 scripts/ci 与 zcode-cua，
        # 新增（如 @zcode/contracts）的包级测试不会进入门禁，因此在这里补一道。
        run: pnpm -r --filter './apps/zcode-cli/packages/*' test
      - name: Vitest suites
        if: ${{ !cancelled() && steps.agent-build.outcome == 'success' }}
        # 这批测试用 vitest，覆盖远控分片/重传/ack、MCP Apps 契约、adapter 出站响应等回归场景；
        # 此前 CI 只跑了 scripts/ci 与包级 node:test，这些套件一直没进门禁。
        # workspace 包的 exports 指向 src，套件不依赖构建产物，因此放在构建步骤之后、release-script tests 之前。
        # UI 留白套件依赖 @ alias 与 SSR JSX，单独使用受控配置；任一命令失败即门禁失败。
        run: |
          pnpm vitest run packages/shared/src/webRemoteControl packages/shared/src/mcp-apps packages/shared/src/task-realtime-validation.test.ts packages/ui/src/lib/webRemoteControlTarget.test.ts packages/desktop/src/main/webRemoteControl/servicePipe.test.ts packages/desktop/src/main/webRemoteControl/hostBridge.test.ts packages/desktop/src/main/webRemoteControl/relayTransport.test.ts packages/desktop/src/main/webRemoteControl/lanDeviceTransport.test.ts packages/desktop/src/main/webRemoteControl/manager.test.ts apps/zcode-cli/packages/adapters/src/network packages/shared/src/zcode-protocol-v4
          pnpm vitest run --config packages/ui/vitest.holes.config.ts
          pnpm vitest run --config packages/ui/vitest.config.ts packages/ui/test/conversationRowSharing.test.ts packages/ui/test/conversationProjectionStore.rowSharing.test.ts
          pnpm vitest run --config packages/ui/vitest.config.ts packages/web/src/mobile
          pnpm vitest run --config packages/ui/vitest.config.ts packages/desktop/src/main/manifestUpdateProvider.test.ts
          # Relay tests exercise the service source over loopback and do not need a relay dist build.
          pnpm vitest run --config packages/ui/vitest.config.ts packages/relay/src
          pnpm vitest run --config packages/ui/vitest.config.ts \
            packages/services/src/gen-ui/adapters/files.test.ts \
            packages/ui/src/app-shell/useWorkflowRunPaneSettingsScope.test.ts \
            packages/ui/src/app-shell/workflowWorkspaceReadPath.test.ts \
            packages/ui/src/lib/workflowExecutionWorkspace.test.ts \
            packages/ui/src/hooks/useWorkflowRunExecutionWorkspace.test.ts \
            packages/ui/src/hooks/useAppPanelsWorkflowArtifact.test.ts \
            packages/ui/src/app-shell/taskNavigationWorkspace.test.ts \
            packages/ui/src/lib/workspaceFileLinkHost.test.ts \
            packages/ui/src/hooks/useWorkspaceOpenInEditorTarget.test.ts \
            packages/ui/src/hooks/useWorkspaceServicesScope.test.ts \
            packages/ui/src/terminal/terminalPanelState.test.ts \
            packages/ui/src/lib/markdownFileLink.test.ts \
            packages/ui/src/components/ai-elements/markdown-image-scope.test.ts \
            packages/ui/src/components/ai-elements/messageMarkdownFilePipeline.test.ts \
            packages/ui/src/lib/taskExecutionWorkspacePath.test.ts \
            packages/ui/src/lib/taskExecutionWorkspaceServices.test.ts \
            packages/ui/src/lib/workspaceSidePanePlanDetailRoot.test.ts \
            packages/ui/src/lib/documentFileReferenceRootPath.test.ts \
            packages/ui/src/lib/workspaceSidePaneTerminal.test.ts \
            packages/ui/src/workspace-file-tree/sidebarFileTreePath.test.ts \
            packages/ui/src/settings/saved-workflows/globalWorkflowGroupHelpers.test.ts \
            packages/ui/src/settings/saved-workflows/savedWorkflowRunOpenParams.test.ts \
            packages/ui/src/v4/sessionWorkspacePath.test.ts \
            packages/ui/src/v4/useConversationProjection.test.ts \
            packages/ui/src/v4/primaryDraftSessionBinding.test.ts \
            apps/zcode-cli/packages/core/src/runtime/helpers/gen-ui-output.test.ts \
            apps/zcode-cli/packages/core/src/runtime/methods/session-persistence-concurrency.test.ts \
            packages/shared/src/node/genUiPaths.test.ts
      - name: Release tests
        if: ${{ !cancelled() && steps.agent-build.outcome == 'success' }}
        run: node --test --test-isolation=none scripts/ci/*.test.mjs
      - name: Computer Use runtime and SDK checks
        run: |
          node --test --test-isolation=none packages/zcode-cua/test/*.test.mjs
          pnpm --filter @zcode/zcode-cua-plugin check:sdk
      - name: Standalone CLI and TUI model setup checks
        run: |
          node scripts/ci/cli-local-entrypoints-smoke.mjs
          node scripts/ci/local-automation-protocol-smoke.mjs
          node scripts/ci/bundled-plugin-marketplace-protocol-smoke.mjs
          node scripts/ci/tui-model-setup-smoke.mjs
      - name: Install browser for remote form checks
        run: pnpm exec playwright-core install --with-deps chromium webkit
      - name: Web remote-control browser checks
        run: |
          pnpm --filter @zcode/bootstrap exec node --import tsx --test --test-isolation=none test/web-remote-v4-stream.test.ts test/web-remote-command-inbox.test.ts test/active-session-resume.test.ts
          node scripts/ci/web-remote-control-window-sync-smoke.mjs
          node scripts/ci/web-remote-control-mobile-smoke.mjs
      - name: Storage scan lifecycle browser checks
        run: node scripts/ci/storage-scan-lifecycle-smoke.mjs
      - name: Install isolated Computer Use test desktop
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb openbox bubblewrap dbus-x11 at-spi2-core apparmor
          # Ubuntu 24.04 的 userns 限制会阻止 bwrap 配置隔离网络的 loopback。
          # 仅授权 CI 的 bwrap 创建命名空间，保留全局 AppArmor 与测试断网隔离。
          sudo apparmor_parser -r <<'PROFILE'
          abi <abi/4.0>,
          profile zcodium-ci-bwrap /usr/bin/bwrap flags=(unconfined) {
            userns,
          }
          PROFILE
      - name: Computer Use actions without network access
        run: node scripts/ci/cua-actions-smoke.mjs
      - name: Remote form browser checks
        run: node scripts/ci/remote-form-smoke.mjs
      - name: Bundled help browser checks
        run: node scripts/ci/bundled-help-smoke.mjs
      - name: Local feedback browser checks
        run: node scripts/ci/local-feedback-smoke.mjs
      - name: Imported conversation browser checks
        run: node scripts/ci/local-share-context-smoke.mjs
      - name: Self-managed model settings
        run: |
          pnpm --filter @zcode/desktop build:no-runtime-assets
          node scripts/ci/local-scheduler-smoke.mjs
          node scripts/ci/self-managed-models-smoke.mjs
          node scripts/ci/model-choice-smoke.mjs
          node scripts/ci/local-usage-smoke.mjs
          node scripts/ci/local-automations-smoke.mjs
          node scripts/ci/local-context-smoke.mjs
          node scripts/ci/session-local-errors-smoke.mjs
          node scripts/ci/local-onboarding-smoke.mjs
      - name: Bundled catalog browser checks
        run: |
          node scripts/ci/client-catalog-smoke.mjs
          node scripts/ci/bundled-plugin-marketplace-smoke.mjs
      - name: Model setup without official purchases
        run: node scripts/ci/no-official-purchase-smoke.mjs
      - name: Local preferences without official accounts
        run: node scripts/ci/local-preferences-smoke.mjs
      - name: Verify self-managed image search configuration
        run: node scripts/ci/image-search-config-smoke.mjs
      - name: Startup without official account restoration
        run: |
          pnpm --filter @zcode/web build
          node scripts/ci/root-startup-smoke.mjs
          node scripts/ci/startup-animation-smoke.mjs
          node scripts/ci/web-entry-without-oauth-smoke.mjs
      - name: Conversation file browser checks
        run: |
          node scripts/ci/copy-conversation-markdown-smoke.mjs
          node scripts/ci/conversation-export-smoke.mjs
          node scripts/ci/conversation-import-smoke.mjs

  build:
    name: Build (${{ matrix.platform }} ${{ matrix.arch }})
    # checks 与平台打包没有产物依赖，从同一 ref 并行开始；本工作流只上传 Actions artifacts。
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: win
            runner: windows-2025
            arch: x64
          # Windows arm64：electron-builder 在 x64 runner 上交叉构建；原生库
          # @trycua/cua-driver-win32-arm64-msvc 已随 SDK optionalDependencies 分发。
          # 这是唯一一个 crossArch 目标：原生库无法在 x64 Node/Electron 里加载。
          - platform: win
            runner: windows-2025
            arch: arm64
            crossArch: true
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      ZCODE_TARGET_OS: ${{ matrix.platform }}
      ZCODE_TARGET_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - name: Prepare desktop runtime
        run: pnpm prepare:desktop-runtime
      # 交叉架构（Windows arm64 在 x64 runner 上打包）加载不了目标原生库，
      # 只能校验随包资产文件；执行探针留给同架构的原生 runner。
      - name: Verify native CUA and shared plugin host
        if: matrix.crossArch != true
        run: node scripts/ci/cua-driver-smoke.mjs
      - name: Verify staged CUA assets (cross-arch)
        if: matrix.crossArch == true
        run: node scripts/ci/cua-driver-smoke.mjs --files-only
      - name: Build workspace and desktop
        run: pnpm build:bootstrap
      - name: Package and verify desktop
        run: pnpm bundle:desktop -- --os "$ZCODE_TARGET_OS" --arch "$ZCODE_TARGET_ARCH" --skip-prepare --skip-build
      # 同理：交叉架构的 Electron 可执行文件在 x64 runner 上跑不起来。
      - name: Verify CUA with the packaged Electron runtime
        if: matrix.crossArch != true
        run: node scripts/ci/cua-driver-smoke.mjs --packaged
      - name: Collect installers
        run: node scripts/ci/desktop-release.mjs collect "$ZCODE_TARGET_OS" "$ZCODE_TARGET_ARCH"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/release-assets/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  build-macos:
    name: Build (mac ${{ matrix.arch }})
    # 本仓库只在手动运行时触发，因此每次都产出 arm64 与 x64 两个 DMG。
    # checks 与 macOS 打包并行；本工作流只上传 Actions artifacts。
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        arch: ["arm64", "x64"]
    # arm64 与 x64 各自用原生 runner，避免交叉打包混入错误架构的原生库。
    runs-on: ${{ matrix.arch == 'arm64' && 'macos-15' || 'macos-15-intel' }}
    timeout-minutes: 120
    env:
      ZCODE_TARGET_OS: mac
      ZCODE_TARGET_ARCH: ${{ matrix.arch }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - name: Prepare desktop runtime
        run: pnpm prepare:desktop-runtime
      - name: Build workspace and desktop
        run: pnpm build:bootstrap
      - name: Package and verify desktop
        run: pnpm bundle:desktop -- --os mac --arch "$ZCODE_TARGET_ARCH" --skip-prepare --skip-build
      - name: Collect installers
        run: node scripts/ci/desktop-release.mjs collect mac "$ZCODE_TARGET_ARCH"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: desktop-mac-${{ matrix.arch }}
          path: dist/release-assets/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
